x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: withdraw-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-password}
      POSTGRES_DB: ${DB_NAME:-withdraw_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-withdraw_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  migrate:
    container_name: withdraw-migrate
    build:
      context: .
      args:
        APP: migrate
    environment: &app_environment
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-password}
      DB_NAME: ${DB_NAME:-withdraw_db}
      DB_SSL_MODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  api:
    container_name: withdraw-api
    build:
      context: .
      args:
        APP: api
    environment:
      <<: *app_environment
      APP_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-development-secret}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    stop_grace_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *default-logging

volumes:
  postgres_data:
